# .pre-commit-config.yaml - AUTOMATIC CODE QUALITY FOR ANY PYTHON PROJECT
# Runs before EVERY git commit
repos:

  # ═══════════════════════════════════════════════════════════════════════════
  # 1. RUFF - LINTING + FORMATTING
  # ═══════════════════════════════════════════════════════════════════════════
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # ═══════════════════════════════════════════════════════════════════════════
  # 2. MYPY - STATIC TYPE CHECKING (runs via uv, sees all real dependencies)
  # ═══════════════════════════════════════════════════════════════════════════
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy src
        language: system
        pass_filenames: false
        types: [python]

  # ═══════════════════════════════════════════════════════════════════════════
  # 3. FILE CLEANLINESS
  # ═══════════════════════════════════════════════════════════════════════════
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # ═══════════════════════════════════════════════════════════════════════════
  # 4. UV LOCK - REPRODUCIBLE DEPENDENCIES
  # ═══════════════════════════════════════════════════════════════════════════
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.9.26
    hooks:
      - id: uv-lock
