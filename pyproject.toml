[project]
name = "goodreads-books"
version = "0.1.0"
description = "An analysis on goodreads books rating system & its readers' preferences"
readme = "README.md"
authors = [
    { name = "Prince Foli Adolphe Hyacinthe Acouetey", email = "p.f.a.h.acouetey@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.8.1,<=1.15.2",
    "bcrypt==4.0.1",
    "bs4>=0.0.2",
    "crawlee[beautifulsoup]>=1.11.0",
    "huggingface-hub>=2.2.0",
    "loguru>=0.7.3",
    "numpy>=2.5.4",
    "passlib>=1.7.4",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "pymysql>=1.1.1,<1.2.dev0",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.0.14,<2.1.0",
    "sqlalchemy-utils>=0.43.0",
    "sqlmodel>=0.0.19,<0.0.45",
    "zenml[local,server]==0.98.0",
]

[project.scripts]
goodreads-books = "goodreads_books:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "ipywidgets>=8.1.9",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.5",
    "ty>=0.0.75",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint.isort]
known-first-party = ["numerai_tournaments"]

[tool.deptry]
known_first_party = ["numerai_tournaments"]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["main.py"]
