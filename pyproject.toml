[project]
name = "goodreads-books"
version = "0.1.0"
description = "Goodreads Books Rating System & Readers Preferences"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "crawlee[beautifulsoup]>=1.9.3",
    "huggingface-hub>=1.28.0",
    "loguru>=0.7.3",
    "polars>=1.44.0",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "ipykernel>=7.3.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.4",
    "ty>=0.0.74",
]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "main.py",
]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = [
    "src/",
    "tests/",
    "notebooks/"
]

[tool.ty.environment]
python-version = "3.12"

[tool.deptry]
known_first_party = ["src"]
