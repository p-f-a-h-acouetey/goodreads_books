[project]
name = "goodreads-books"
version = "0.1.0"
description = "Goodreads Books Rating System & Readers Preferences"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "crawlee[beautifulsoup]>=1.8.2",
    "fastparquet>=2026.5.0",
    "huggingface-hub>=1.23.0",
    "ipykernel>=7.3.0",
    "loguru>=0.7.3",
    "lxml>=6.1.1",
    "matplotlib>=3.11.0",
    "polars>=1.42.1",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "selenium>=4.45.0",
    "webdriver-manager>=4.1.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.0",
    "ty>=0.0.63",
]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "src/goodreads_etl/main.py",
]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src/goodreads_etl"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
exclude = ["tests/**/*.py"]
